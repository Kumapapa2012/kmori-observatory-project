# 天文台サーバーの設定。相対パスはプロジェクトのルートから解決する
[server]
host = "0.0.0.0"
port = 8080
webrtc_port = 8889
mediamtx_api = "http://127.0.0.1:9997"
state_file = "var/state.json"
# HTTPS の証明書（tools/make_cert.sh で作る）。消すと HTTP で動く
tls_cert = "var/tls/cert.pem"
tls_key = "var/tls/key.pem"

# 観測地の初期値（SynScan の既定値）。画面から保存すると var/state.json の値が優先される
[site]
latitude = 35.7333
longitude = 139.75
elevation_m = 0.0

[camera]
device = "/dev/v4l/by-id/usb-SVBONY_SV205_SVBONY_SV205_200901010001-video-index0"

# ファインダーの ELP。露出の上限 5000 は v4l2 の申告値で、0.5 秒まで延びるかは未確認（30fps のまま明るくなる）
[finder]
device = "/dev/v4l/by-id/usb-H264_USB_Camera_H264_USB_Camera_2020032801-video-index0"
exposure_range = [1, 5000]
gain_range = [0, 100]

[capture]
root = "captures"
preview_dir = "var/preview"
rtsp_url = "rtsp://127.0.0.1:8554/camera"
render_device = "/dev/dri/renderD128"
# これを切ると撮影を止める
min_free_gb = 10
# 1080p、30fps の YUYV の実測値（2026-11-01）。開始時の空き容量の判定に使う
video_mb_per_second = 125
video_default_seconds = 120
video_max_seconds = 900
timelapse_min_interval = 5
stall_seconds = 10
settle_seconds = 1.0
still_timeout = 15
stop_timeout = 10

# フォーカスドライバー（Pico）。USB がつながっていなければ「セットされていない」とみなす
[focuser]
port_glob = "/dev/serial/by-id/*MicroPython*"

[mount]
# 架台の接続方式。"synscan" はハンドコントローラー（SynScan）経由のコントローラー版、
# "direct" は SynHub の USB でモーター基板に直結する直結版（2026-11-14 決定）
backend = "direct"
# auto は /dev/serial/by-id から探す（synscan は *Serial*、direct は [mount.direct] の port_glob）
port = "auto"
max_rate = 9
az_limit = 180.0
alt_limit = 90.0
# 1 回の操作（同じ向きに押し続けている間）の上限。速度と時間からの見積もりで判定する。
# 止まったらスティックを一度離さないと、同じ向きには動かない
max_move_deg = 45.0
max_move_seconds = 120.0
# 読み取りがこれ（+ 4°/秒 × 読み取りの間隔）を超えて飛んだら全軸を止める。高度 ±90° での裏返りは除く
jump_deg = 5.0

# 反転時の早回し。amount は度で、推定値より控えめにしている。speeds は速度ごとの実測値（度/秒）で、
# tools/measure_rates.py で測った方位の値（2026-11-01）。高度の読み取りは位置により方位の約半分になるが、
# 映像ではどの高度でも速度 3 で約 1.9'/秒なので、高度にも同じ値を使う
[mount.backlash]
enabled = true

[mount.backlash.speeds]
1 = 0.0018
2 = 0.0083
3 = 0.036
4 = 0.0722
5 = 0.146
6 = 0.292
# 9 は 2026-11-07 の高度 ±24° の往復で、読み取りから測った値。7、8 は未測定
9 = 2.41

# 方位は読み取りと映像の比が約 1.00 なので、読み取りで隙間を追う
[mount.backlash.az]
amount = 0.2
rate = 6
source = "encoder"
lead = 0.3
start_delay = 0.0

# 高度は読み取りが信頼できないので、速度と時間で隙間を追う
[mount.backlash.alt]
amount = 0.098
rate = 5
source = "time"
lead = 0.48
start_delay = 0.4

# 直結版の設定（計画書「段階 2 の決定」）。安全装置の値は safety.py の SafetyConfig の名前で上書きできる
[mount.direct]
port = "auto"
port_glob = "/dev/serial/by-id/*SynHub*"
expected_cpr = 865050

[mount.direct.backlash]
# 2026-11-14 に 2° の目標移動で、同じ向きと反転を比べて測った値（度）
enabled = true
az = 0.5
alt = 0.15

[mount.direct.safety]
# true にすると、向きの基準を選ぶまで軸の 0 から方位 ±30°、高度 ±20°、低速だけに絞る（既定 false）
restricted_mode = false
alt_min = -5.0
alt_max = 92.0
az_span = 180.0
restricted_az = 30.0
restricted_alt = 20.0
restricted_rate = 0.3
max_rate = 3.0
track_max_rate = 0.05
max_move_deg = 45.0
max_move_seconds = 120.0

# 向きの基準に使える目標。観測地（latitude、longitude）から radius_km 以内のときだけ選べる。
# az と alt はその観測地から見た目標の本当の方位・高度（度）
[[mount.direct.landmarks]]
key = "skytree"
label = "スカイツリー先端"
latitude = 35.7333
longitude = 139.7538
radius_km = 1.0
# 2026-11-07 に計算し、北極星の導入（ずれ 0.22°）で確かめた値
az = 116.49
alt = 5.72

# ファインダーのプレートソルブ（ASTAP）による自動アラインメント（計画書「アライメントの手順（案）」）
[plate_solve]
astap = "astap_cli"
database_dir = "/opt/astap"
database = "w08"
# 切り抜いたあとの画像の高さの視野（度）。2026-11-21 の実測 44.4″/px × 1080
fov_height = 13.3
finder_size = [1920, 1080]
# 左端の縞を避けるため、左右をこの幅（画素）ずつ切る
crop_x = 160
# 違う露出のコマを何枚重ねて解くか（ざらつきを √枚数 分の 1 に）。1 なら 1 コマ。
# 2026-11-22 に高度 30° で、1 コマは解けず 8 枚平均は 0.9 秒で解けた
stack = 8
# ヒントなしで解くときは 40 秒ほどかかる
timeout = 90
# 各点の残りの誤差の許容範囲（度、主鏡の視野の縦の半分）と、点の数
tolerance = 0.1
# 点を置く高度の範囲（度）。下端・上端・中ほどを順に使う。高いと首が疲れる向きになるので 50° まで
alt_band = [30.0, 50.0]
points = 3
max_points = 5
max_attempts = 8
workdir = "var/plate"
# 導入のあとファインダーで解いて寄せる（API の center が既定 true）。差がこれ以下（度）で終える
center_tolerance = 0.03
center_rounds = 3
